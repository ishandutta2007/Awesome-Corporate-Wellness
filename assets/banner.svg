<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .orb-pulse {
      animation: pulseAnim 8s ease-in-out infinite alternate;
    }
    .orb-float {
      animation: floatAnim 10s ease-in-out infinite alternate;
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .ecg-flow {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawHeartbeat 4s ease-in-out infinite;
    }
    .pill-glow {
      transition: all 0.3s ease;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
      100% { transform: scale(0.95) translate(-15px, 20px); opacity: 0.25; }
    }
    @keyframes floatAnim {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(-30px, 25px); opacity: 0.4; }
      100% { transform: translate(25px, -20px); opacity: 0.2; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    @keyframes drawHeartbeat {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      40% { stroke-dashoffset: 0; opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -400; opacity: 0.2; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <g class="orb-pulse">
    <circle cx="180" cy="110" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
    <circle cx="1020" cy="290" r="180" fill="#6366f1" opacity="0.22" filter="url(#glow)" />
  </g>
  <g class="orb-float">
    <circle cx="950" cy="90" r="130" fill="#10b981" opacity="0.2" filter="url(#glow)" />
    <circle cx="320" cy="330" r="140" fill="#8b5cf6" opacity="0.22" filter="url(#glow)" />
  </g>

  <!-- Ambient Dynamic ECG / Vitality Wave in Lower Background -->
  <path class="wave-line" d="M 0 350 Q 150 320 300 350 T 600 350 T 900 350 T 1200 350" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
  <path class="ecg-flow" d="M 50 370 L 380 370 L 400 350 L 415 395 L 435 320 L 455 400 L 470 365 L 490 370 L 1150 370" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.75" />

  <!-- Floating Feature Badges / Interactive Pills (Subtle Background Dynamics) -->
  <g opacity="0.85" transform="translate(0, 0)">
    <!-- Pill 1: Mental Health -->
    <g transform="translate(140, 48)">
      <rect width="165" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧠 Mental Health</text>
    </g>

    <!-- Pill 2: Burnout Prevention -->
    <g transform="translate(325, 48)">
      <rect width="185" height="34" rx="17" fill="#1e293b" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="5" fill="#f43f5e" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Burnout Detection</text>
    </g>

    <!-- Pill 3: Employee Wellbeing -->
    <g transform="translate(530, 48)">
      <rect width="185" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌿 Employee Wellbeing</text>
    </g>

    <!-- Pill 4: People Analytics -->
    <g transform="translate(735, 48)">
      <rect width="175" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="5" fill="#8b5cf6" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 People Analytics</text>
    </g>

    <!-- Pill 5: Open-Source First -->
    <g transform="translate(930, 48)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="5" fill="#f59e0b" />
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⭐ Open-Source</text>
    </g>
  </g>

  <!-- FOREGROUND: High-Contrast Center Branding & Texts (Guaranteed Readable & Crisp) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 138)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">✨ CURATED RESOURCE ECOSYSTEM ✨</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="215" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">
    Awesome Corporate Wellness
  </text>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">
    Enterprise SaaS Platforms &amp; Privacy-First Open-Source Infrastructure
  </text>

  <!-- Tagline / Keywords -->
  <text x="600" y="295" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.4">
    Pulse Check-ins • Burnout Risk Detection • Workplace Mental Health • HR Analytics
  </text>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" />
</svg>
